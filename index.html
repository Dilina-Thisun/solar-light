<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Light Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #06141f, #0d2538, #132f47);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      animation: float 12s infinite ease-in-out;
      backdrop-filter: blur(10px);
    }

    .circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: -50px;
      left: -80px;
    }

    .circle:nth-child(2) {
      width: 220px;
      height: 220px;
      bottom: -40px;
      right: -50px;
      animation-delay: 2s;
    }

    .circle:nth-child(3) {
      width: 160px;
      height: 160px;
      top: 50%;
      left: 10%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-30px) rotate(10deg);
      }
    }

    .container {
      width: 420px;
      padding: 35px;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      transform-style: preserve-3d;
      animation: cardFloat 6s infinite ease-in-out;
    }

    @keyframes cardFloat {
      0%,100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #d9d9d9;
      margin-bottom: 35px;
      font-size: 14px;
    }

    .light-card {
      width: 180px;
      height: 180px;
      margin: auto;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
      transition: 0.4s ease;
      position: relative;
    }

    .light-card.active {
      background: radial-gradient(circle at center, #ffe066, #f59e0b);
      box-shadow:
        0 0 40px rgba(255, 217, 0, 0.8),
        0 0 90px rgba(255, 200, 0, 0.5),
        inset 0 0 30px rgba(255,255,255,0.4);
    }

    .bulb {
      font-size: 80px;
      transition: 0.4s;
    }

    .status {
      margin-top: 25px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }

    .controls {
      margin-top: 35px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      color: white;
    }

    .on-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 10px 20px rgba(34,197,94,0.3);
    }

    .off-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 20px rgba(239,68,68,0.3);
    }

    button:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .power-meter {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 90px;
    }

    .bar {
      width: 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      transition: 0.3s ease;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
    }

    .bar.active {
      background: linear-gradient(to top, #f59e0b, #fde047);
      box-shadow: 0 0 15px rgba(255, 221, 0, 0.8);
    }

    .bar:nth-child(1) { height: 20px; }
    .bar:nth-child(2) { height: 35px; }
    .bar:nth-child(3) { height: 50px; }
    .bar:nth-child(4) { height: 65px; }
    .bar:nth-child(5) { height: 80px; }

    .slider-box {
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .slider-title {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    input[type="range"] {
      width: 100%;
      appearance: none;
      height: 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #facc15;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(250,204,21,0.7);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #cbd5e1;
    }

    @media(max-width: 500px){
      .container {
        width: 92%;
        padding: 25px;
      }

      .title {
        font-size: 26px;
      }

      .light-card {
        width: 150px;
        height: 150px;
      }

      .bulb {
        font-size: 65px;
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="container">

    <h1 class="title">SOLAR LIGHT</h1>
    

    <div class="light-card" id="lightCard">
      <div class="bulb">💡</div>
    </div>

    <div class="status" id="statusText">LIGHT OFF</div>

    <div class="power-meter">
      <div class="bar" id="bar1"></div>
      <div class="bar" id="bar2"></div>
      <div class="bar" id="bar3"></div>
      <div class="bar" id="bar4"></div>
      <div class="bar" id="bar5"></div>
    </div>

    <div class="controls">

      <div class="buttons">
        <button class="on-btn" onclick="turnOn()">TURN ON</button>
        <button class="off-btn" onclick="turnOff()">TURN OFF</button>
      </div>

      <div class="slider-box">
        <div class="slider-title">
          <span>Brightness</span>
          <span id="brightnessValue">180</span>
        </div>

        <input
          type="range"
          min="0"
          max="255"
          value="180"
          id="brightnessSlider"
        />
      </div>

    </div>

    <div class="footer">
      Designed & Developed by <b>DT_SOLUTION</b> ⚡
    </div>

  </div>

  <script>

    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {
        apiKey: "AIzaSyBs-Rg0G1tyM6hxZv1OL-1mLB1TY0IHGts",
        authDomain: "solarlight-990ae.firebaseapp.com",
        databaseURL: "https://solarlight-990ae-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "solarlight-990ae",
        storageBucket: "solarlight-990ae.firebasestorage.app",
        messagingSenderId: "476848194918",
        appId: "1:476848194918:web:be636c76e2917897bb74a7",
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    // =====================================
    // ELEMENTS
    // =====================================

    const lightCard = document.getElementById("lightCard");
    const statusText = document.getElementById("statusText");
    const brightnessSlider = document.getElementById("brightnessSlider");
    const brightnessValue = document.getElementById("brightnessValue");

    const bars = [
      document.getElementById("bar1"),
      document.getElementById("bar2"),
      document.getElementById("bar3"),
      document.getElementById("bar4"),
      document.getElementById("bar5")
    ];

    // =====================================
    // BUTTON FUNCTIONS
    // =====================================

    function turnOn() {
      db.ref("solarLight/state").set(1);
    }

    function turnOff() {
      db.ref("solarLight/state").set(0);
    }

    // =====================================
    // BRIGHTNESS CONTROL
    // =====================================

    brightnessSlider.addEventListener("input", () => {

      let value = brightnessSlider.value;

      brightnessValue.innerText = value;

      db.ref("solarLight/brightness").set(parseInt(value));
    });

    // =====================================
    // REALTIME LISTENERS
    // =====================================

    db.ref("solarLight/state").on("value", snapshot => {

      const state = snapshot.val();

      if(state == 1){

        lightCard.classList.add("active");
        statusText.innerText = "LIGHT ON";

      } else {

        lightCard.classList.remove("active");
        statusText.innerText = "LIGHT OFF";
      }
    });

    db.ref("solarLight/brightness").on("value", snapshot => {

      const brightness = snapshot.val();

      brightnessSlider.value = brightness;
      brightnessValue.innerText = brightness;

      let activeBars = Math.ceil((brightness / 255) * 5);

      bars.forEach((bar, index) => {
        if(index < activeBars){
          bar.classList.add("active");
        } else {
          bar.classList.remove("active");
        }
      });
    });

  </script>

</body>
</html>
